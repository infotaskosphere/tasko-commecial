name: Run government fee invoice migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply migration
        run: python scripts/apply_govt_fee_invoice_flow.py

      - name: Validate Python backend
        run: python -m py_compile backend/compliance.py backend/invoicing.py

      - name: Commit source change and clean migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply_govt_fee_invoice_flow.py .github/workflows/apply-govt-fee-invoice-flow.yml .github/workflows/run-govt-fee-pr.yml
          git add frontend/src/pages/Invoicing.jsx
          git commit -m "feat: add controlled government fee invoice selection"
          git push origin HEAD:${{ github.head_ref }}
