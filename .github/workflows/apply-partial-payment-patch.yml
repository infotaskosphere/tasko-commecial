name: Apply Invoice Partial Payment Patch

on:
  push:
    branches:
      - feature/master-console

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply partial payment patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply surgical invoice changes
        run: python scripts/apply_partial_payment_patch.py

      - name: Validate Python syntax
        run: python -m py_compile backend/invoicing.py scripts/apply_partial_payment_patch.py

      - name: Remove one-shot patch tooling
        run: |
          rm -f scripts/apply_partial_payment_patch.py .github/workflows/apply-partial-payment-patch.yml

      - name: Commit merged invoice changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Invoicing.jsx backend/invoicing.py
          git add -A scripts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply partial payment invoice patch"
          git push
