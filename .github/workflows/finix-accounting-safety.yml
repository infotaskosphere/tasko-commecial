name: Finix Accounting Safety

on:
  push:
    branches:
      - feature/finix-phase-1-accounting-safety
      - feature/master-console
      - feature/finix-complete-agent
      - feature/finix-final-integration
  pull_request:

jobs:
  backend-accounting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile accounting modules
        run: |
          python -m py_compile backend/accounting_ai/accounting_controls.py
          python -m py_compile backend/accounting_ai/accounting_engine.py
          python -m py_compile backend/accounting_ai/accounting_completeness.py
          python -m py_compile backend/accounting_ai/financial_validator.py
          python -m py_compile backend/accounting_ai/gst_engine.py
          python -m py_compile backend/accounting_ai/tds_engine.py
          python -m py_compile backend/accounting_ai/journal_builder.py
          python -m py_compile backend/accounting_ai/posting_rules.py
          python -m py_compile backend/accounting_ai/posting_storage.py
          python -m py_compile backend/accounting_ai/voucher_builder.py
          python -m py_compile backend/accounting_ai/finix_learning.py
          python -m py_compile backend/accounting_ai/finix_ai_router.py
          python -m py_compile backend/accounting_ai/finix_agent_complete.py
          python -m py_compile backend/accounting_ai/finix_agent_mount.py
          python -m py_compile backend/accounting_ai/finix_reconciliation_agent.py
          python -m py_compile backend/accounting_ai/finix_complete_router.py
          python -m py_compile backend/accounting_lock.py
      - name: Verify accounting controls import
        env:
          ENV_MODE: development
        run: python -c "import backend.accounting_ai.accounting_controls as controls; assert controls.ApprovalDecision; print('accounting_controls import: OK')"
      - name: Verify full backend import
        env:
          ENV_MODE: development
        run: python -c "import backend.server as server; assert server.app; print('backend.server import: OK')"
      - name: Run Finix accounting tests
        env:
          ENV_MODE: development
        run: pytest -q backend/tests/test_accounting_controls.py backend/tests/test_finix_statutory_controls.py backend/tests/test_accounting_completeness.py backend/tests/test_finix_complete_agent.py backend/tests/test_finix_complete_router.py
