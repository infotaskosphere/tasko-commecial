name: Repair task popup JSX

on:
  push:
    branches:
      - feature/master-console

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Create Task popup animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Tasks.jsx')
          s = p.read_text(encoding='utf-8')
          old_open = '''      <AnimatePresence>{showCreateModal&&<motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-[260] flex items-center justify-center bg-slate-950/50 p-4" onClick={()=>setShowCreateModal(false)}>\n        <motion.div initial={{scale:.98,opacity:0}} animate={{scale:1,opacity:1}} exit={{scale:.98,opacity:0}} className="w-full max-w-3xl max-h-[94vh] overflow-hidden border border-slate-200 bg-white shadow-2xl rounded-none flex flex-col" onClick={e=>e.stopPropagation()}>'''
          new_open = '''      {showCreateModal&&<div className="fixed inset-0 z-[260] flex items-center justify-center bg-slate-950/50 p-4" onClick={()=>setShowCreateModal(false)}>\n        <div className="w-full max-w-3xl max-h-[94vh] overflow-hidden border border-slate-200 bg-white shadow-2xl rounded-none flex flex-col" onClick={e=>e.stopPropagation()}>'''
          if old_open not in s:
              raise SystemExit('Create Task animated opening block not found; refusing to change the file.')
          s = s.replace(old_open, new_open, 1)
          old_close = '''          </div>\n        </motion.div>\n      </motion.div>}\n      </AnimatePresence>'''
          new_close = '''          </div>\n        </div>}'''
          if old_close not in s:
              raise SystemExit('Create Task animated closing block not found; refusing to change the file.')
          s = s.replace(old_close, new_close, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build frontend before commit
        run: |
          cd frontend
          npm install
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Tasks.jsx
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git commit -m 'fix: remove task creation popup flicker'
          git push origin HEAD:feature/master-console
