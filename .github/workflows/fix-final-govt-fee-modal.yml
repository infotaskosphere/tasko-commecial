name: Final government fee modal fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python scripts/fix_final_govt_fee_modal.py
      - run: python -m py_compile backend/compliance.py backend/invoicing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Invoicing.jsx
          git rm -f scripts/fix_final_govt_fee_modal.py .github/workflows/fix-final-govt-fee-modal.yml
          git commit -m "fix: finalize invoice modal dimensions"
          git push origin HEAD:${{ github.head_ref }}
