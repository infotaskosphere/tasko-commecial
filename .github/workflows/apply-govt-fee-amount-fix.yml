name: Apply Govt Fee Amount Fix

on:
  push:
    branches:
      - fix/govt-fee-client-dropdown-pro

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[botfix-govt-fee-amount]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/govt-fee-client-dropdown-pro
          fetch-depth: 0

      - name: Patch Government Fee amount flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inv = Path('frontend/src/pages/Invoicing.jsx')
          s = inv.read_text(encoding='utf-8')
          old_start = "  const loadGovernmentFees = useCallback(async () => {\n"
          old_end = "  }, [form.client_id, form.invoice_date]);\n\n  useEffect(() => {\n    if (activeTab === 'govt_fees'"
          a = s.find(old_start)
          b = s.find(old_end, a)
          if a < 0 or b < 0:
              raise SystemExit('Could not locate loadGovernmentFees block')

          new_block = r'''  const loadGovernmentFees = useCallback(async () => {
            if (!form.client_id) {
              setGovtFees([]);
              setGovtFeeSelection(new Set());
              return;
            }

            setGovtFeeLoading(true);
            try {
              const [complianceRes, standaloneRes] = await Promise.all([
                api.get(`/compliance/by-client/${form.client_id}`, { params: { govt_fees: true } }),
                api.get('/compliance/standalone-govt-fees', { params: { client_id: form.client_id } }),
              ]);

              const cycle = String(form.invoice_date || format(new Date(), 'yyyy-MM-dd')).slice(0, 7);
              const money = value => {
                if (value === null || value === undefined || value === '') return 0;
                const cleaned = String(value).replace(/[₹,\s]/g, '');
                const parsed = Number(cleaned);
                return Number.isFinite(parsed) ? parsed : 0;
              };
              const notBilled = item => {
                if (item.govt_fee_invoice_id || item.invoice_id || item.invoice_no) return false;
                if (item.bill_in_next_cycle) {
                  const deferred = String(item.govt_fee_deferred_at || '').slice(0, 7);
                  if (deferred && cycle <= deferred) return false;
                }
                return true;
              };

              const complianceRows = Array.isArray(complianceRes.data?.items)
                ? complianceRes.data.items
                : [];
              const standaloneRows = Array.isArray(standaloneRes.data?.items)
                ? standaloneRes.data.items
                : [];

              const complianceFees = complianceRows
                .filter(notBilled)
                .map(item => {
                  const amount = money(
                    item.amount ??
                    item.govt_fees_amount ??
                    item.govt_fee_amount ??
                    item.fee_amount
                  );
                  return {
                    marker: `compliance_govt_fee:${item.assignment_id}`,
                    source: 'compliance',
                    title: item.name || 'Government Fee',
                    category: item.category || 'OTHER',
                    amount,
                    srn: item.govt_fees_srn || item.srn || '',
                    payment_date: item.payment_date || item.govt_fee_billed_at || item.updated_at || '',
                    notes: item.govt_fees_notes || item.notes || '',
                  };
                })
                .filter(item => item.amount > 0);

              const standaloneFees = standaloneRows
                .filter(item => notBilled(item) && (!item.status || item.status === 'paid'))
                .map(item => ({
                  marker: `standalone_govt_fee:${item.id}`,
                  source: 'standalone',
                  title: item.title || 'Government Fee',
                  category: item.category || 'OTHER',
                  amount: money(item.amount),
                  srn: item.srn || '',
                  payment_date: item.payment_date || item.updated_at || '',
                  notes: item.notes || '',
                }))
                .filter(item => item.amount > 0);

              const fees = [...complianceFees, ...standaloneFees];
              setGovtFees(fees);
              setGovtFeeSelection(new Set());
            } catch (err) {
              console.warn('Could not load Government Fees:', err?.response?.data || err);
              setGovtFees([]);
              setGovtFeeSelection(new Set());
              toast.error('Could not load Government Fees for this client');
            } finally {
              setGovtFeeLoading(false);
            }
          }, [form.client_id, form.invoice_date]);

'''
          s = s[:a] + new_block + s[b:]
          inv.write_text(s, encoding='utf-8')

          backend = Path('backend/compliance.py')
          s = backend.read_text(encoding='utf-8')
          old = '''        items.append({
              "assignment_id":    a["id"],
              "compliance_id":    m["id"],
              "name":             m.get("name"),
              "category":         m.get("category"),
              "frequency":        m.get("frequency"),
              "fy_year":          m.get("fy_year"),
              "period_label":     m.get("period_label"),
              "due_date":         m.get("due_date"),
              "status":           a.get("status"),
              "govt_fees_amount": a.get("govt_fees_amount", 0) or 0,
              "govt_fees_notes":  a.get("govt_fees_notes", "") or "",
              "govt_fees_srn":    a.get("govt_fees_srn", "") or "",
'''
          new = '''        # Canonicalize the fee amount at the API boundary. New records use
          # govt_fees_amount; legacy rows may contain amount/govt_fee_amount.
          raw_fee_amount = (
              a.get("govt_fees_amount")
              if a.get("govt_fees_amount") is not None
              else a.get("govt_fee_amount")
          )
          if raw_fee_amount is None:
              raw_fee_amount = a.get("amount", 0)
          try:
              fee_amount = float(raw_fee_amount or 0)
          except (TypeError, ValueError):
              fee_amount = 0.0

          items.append({
              "assignment_id":    a["id"],
              "compliance_id":    m["id"],
              "name":             m.get("name"),
              "category":         m.get("category"),
              "frequency":        m.get("frequency"),
              "fy_year":          m.get("fy_year"),
              "period_label":     m.get("period_label"),
              "due_date":         m.get("due_date"),
              "status":           a.get("status"),
              "amount":           fee_amount,
              "govt_fees_amount": fee_amount,
              "govt_fees_notes":  a.get("govt_fees_notes", "") or "",
              "govt_fees_srn":    a.get("govt_fees_srn", "") or "",
'''
          if old not in s:
              raise SystemExit('Could not locate compliance Govt Fee response block')
          s = s.replace(old, new, 1)
          backend.write_text(s, encoding='utf-8')
          print('Government Fee amount normalization applied')
          PY

      - name: Validate
        run: |
          python3 -m py_compile backend/compliance.py
          grep -q "const money = value =>" frontend/src/pages/Invoicing.jsx
          grep -q '"amount":           fee_amount' backend/compliance.py
          git diff --check

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Invoicing.jsx backend/compliance.py .github/workflows/apply-govt-fee-amount-fix.yml
          git diff --cached --check
          git commit -m "fix: normalize govt fee amount in invoice review [botfix-govt-fee-amount]"
          git push origin HEAD:fix/govt-fee-client-dropdown-pro
