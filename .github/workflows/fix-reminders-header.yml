name: Fix Reminders Header

on:
  push:
    branches:
      - feature/master-console

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: align reminders header actions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Reminders header layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/Reminders.jsx')
          s = p.read_text()

          replacements = [
              (
                  'actionsClassName="lg:flex-none lg:w-auto"',
                  'actionsClassName="lg:flex-none lg:w-[660px] lg:max-w-[660px]"',
              ),
              (
                  'className="flex flex-wrap items-center justify-end gap-2 w-full">',
                  'className="grid grid-cols-3 gap-2 w-full min-w-0">',
              ),
              (
                  'className="w-full min-w-0 h-9 text-xs font-semibold whitespace-nowrap rounded-none bg-white/15',
                  'className="w-full min-w-0 h-9 text-xs font-semibold whitespace-nowrap rounded-none bg-white/15',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in s and old != new:
                  s = s.replace(old, new, 1)
                  changed = True

          # Ensure the three-column action grid remains usable at desktop sizes
          # and that labels never wrap inside the header controls.
          s = s.replace(
              'className="grid grid-cols-3 gap-2 w-full min-w-0">',
              'className="grid grid-cols-3 gap-2 w-full min-w-0 items-stretch">',
              1,
          )

          p.write_text(s)
          if not changed:
              raise SystemExit('No header layout replacement was needed')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Reminders.jsx
          git rm .github/workflows/fix-reminders-header.yml
          git commit -m "fix: align reminders header actions"
          git push origin feature/master-console
