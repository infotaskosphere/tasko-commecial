name: DSC Agent Windows Installer

# Builds TaskosphereAgentSetup.exe on Windows and publishes it as the GitHub
# release "agent-v<version>" (version from dsc-agent/package.json). The web app
# downloads it from:
#   https://github.com/infotaskosphere/tasko-commecial/releases/latest/download/TaskosphereAgentSetup.exe

on:
  push:
    branches: [feature/master-console]
    paths:
      - "dsc-agent/**"
      - ".github/workflows/dsc-agent-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsc-agent-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: dsc-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read version
        id: version
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build TaskosphereAgent.exe
        run: npx pkg . --targets node18-win-x64 --output dist/TaskosphereAgent.exe

      - name: Smoke-test the exe
        run: |
          $p = Start-Process -FilePath dist\TaskosphereAgent.exe -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:7432/health; $ok = ($r.status -eq 'ok') } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "agent did not answer /health" }
          Write-Host "agent /health ok, version $($r.version)"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\TaskosphereAgent.iss
          Get-Item dist\TaskosphereAgentSetup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TaskosphereAgentSetup-${{ steps.version.outputs.version }}
          path: dsc-agent/dist/TaskosphereAgentSetup.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "agent-v${{ steps.version.outputs.version }}"
          $notes = "Taskosphere Agent ${{ steps.version.outputs.version }} for Windows. Download TaskosphereAgentSetup.exe and run it; no administrator rights needed."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\TaskosphereAgentSetup.exe --clobber
          } else {
            gh release create $tag dist\TaskosphereAgentSetup.exe --title "Taskosphere Agent ${{ steps.version.outputs.version }}" --notes $notes --target ${{ github.sha }} --latest
          }
