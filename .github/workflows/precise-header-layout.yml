name: Precise Header Layout Correction
on:
  push:
    branches: [feature/master-console]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-console
          fetch-depth: 0

      - name: Apply explicit header layout
        shell: python
        run: |
          from pathlib import Path

          # Shared banner: allow pages to opt into an explicit action-slot width.
          p = Path('frontend/src/components/ui/WelcomeBanner.jsx')
          s = p.read_text()
          s = s.replace(
              "export function WelcomeBanner({ title, subtitle, icon: Icon, date, actions, className = '' }) {",
              "export function WelcomeBanner({ title, subtitle, icon: Icon, date, actions, className = '', actionsClassName = '' }) {",
              1,
          )
          s = s.replace(
              '<div className="flex flex-1 min-w-0 justify-end items-center gap-2">',
              '<div className={`flex flex-1 min-w-0 justify-end items-center gap-2 ${actionsClassName}`}>',
              1,
          )
          p.write_text(s)

          # Reminders: explicit 570px action slot on desktop. This prevents
          # the nested flex container from collapsing the 3x2 grid to its
          # content width. Mobile remains full width through w-full.
          p = Path('frontend/src/pages/Reminders.jsx')
          s = p.read_text()
          s = s.replace(
              'actions={\n              <div className="grid grid-cols-3 gap-2 w-[570px] max-w-full flex-shrink-0 min-w-0 ml-auto">',
              'actionsClassName="lg:flex-none lg:w-[570px] lg:max-w-[570px]"\n            actions={\n              <div className="grid grid-cols-3 gap-2 w-full min-w-0">',
              1,
          )
          if 'actionsClassName="lg:flex-none lg:w-[570px] lg:max-w-[570px]"' not in s:
              raise SystemExit('Reminders actionsClassName patch did not apply')
          p.write_text(s)

      - name: Validate
        shell: bash
        run: |
          grep -n 'actionsClassName' frontend/src/components/ui/WelcomeBanner.jsx
          grep -n 'actionsClassName="lg:flex-none lg:w-\[570px\]' frontend/src/pages/Reminders.jsx
          grep -n 'grid-cols-3.*w-full min-w-0' frontend/src/pages/Reminders.jsx

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ui/WelcomeBanner.jsx frontend/src/pages/Reminders.jsx .github/workflows/precise-header-layout.yml
          git commit -m "fix: make reminder header action slot explicit [skip ci]"
          git rm .github/workflows/precise-header-layout.yml
          git commit -m "chore: remove temporary header workflow [skip ci]"
          git push origin feature/master-console
