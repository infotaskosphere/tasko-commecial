name: Precise Header Layout Correction
on:
  push:
    branches: [feature/master-console]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-console
          fetch-depth: 0

      - name: Patch header controls without touching page functionality
        shell: python
        run: |
          from pathlib import Path

          # Action Center: three controls, one row, compact equal widths.
          p = Path('frontend/src/pages/ActionCenter.jsx')
          s = p.read_text()
          s = s.replace(
              'className="grid grid-cols-3 gap-2 w-[520px] max-w-full flex-shrink-0 min-w-0"',
              'className="grid grid-cols-3 gap-2 w-[500px] max-w-full flex-shrink-0 min-w-0"',
              1,
          )
          s = s.replace(
              'className="w-full min-w-0 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold border transition-all active:scale-95 whitespace-nowrap"',
              'className="w-full min-w-0 h-9 flex items-center justify-center gap-1 px-2 rounded-none text-xs font-semibold border transition-all active:scale-95 whitespace-nowrap overflow-hidden"',
              3,
          )
          p.write_text(s)

          # Reminders: keep the requested 3 x 2 equal grid. The prior patch
          # made the grid correctly; this patch only prevents label wrapping
          # and keeps every cell the same dimensions.
          p = Path('frontend/src/pages/Reminders.jsx')
          s = p.read_text()
          marker = '<div className="grid grid-cols-3 gap-2 w-[570px] max-w-full flex-shrink-0 min-w-0 ml-auto">'
          start = s.index(marker)
          end = s.index('\n    </div>', start)
          block = s[start:end]

          block = block.replace(
              'className="w-full h-9 flex items-center justify-center gap-1.5 px-3 rounded-none text-xs font-semibold',
              'className="w-full min-w-0 h-9 flex items-center justify-center gap-1 px-2 rounded-none text-[11px] font-semibold whitespace-nowrap overflow-hidden',
          )
          block = block.replace(
              'className="relative w-full h-9 flex items-center justify-center gap-1.5 px-3 rounded-none text-xs font-semibold',
              'className="relative w-full min-w-0 h-9 flex items-center justify-center gap-1 px-2 rounded-none text-[11px] font-semibold whitespace-nowrap overflow-hidden',
          )
          s = s[:start] + block + s[end:]
          p.write_text(s)

      - name: Validate
        shell: bash
        run: |
          grep -n 'grid-cols-3.*w-\[500px\]' frontend/src/pages/ActionCenter.jsx
          grep -n 'grid-cols-3.*w-\[570px\]' frontend/src/pages/Reminders.jsx
          grep -n 'flex flex-1 min-w-0 justify-end' frontend/src/components/ui/WelcomeBanner.jsx

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ActionCenter.jsx frontend/src/pages/Reminders.jsx .github/workflows/precise-header-layout.yml
          git commit -m "fix: align header controls precisely [skip ci]"
          git rm .github/workflows/precise-header-layout.yml
          git commit -m "chore: remove temporary header workflow [skip ci]"
          git push origin feature/master-console
