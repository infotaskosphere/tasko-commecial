name: Production Hardening Regression

on:
  push:
    branches: ["feature/master-console", "hardening/finix-integrity-20260918", "hardening/finix-phase3-20260918"]
  pull_request:
    branches: ["feature/master-console"]

jobs:
  backend-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run hardening regression tests
        run: python -m unittest -v test_production_hardening.py test_finix_integrity_hardening.py test_phase2_runtime_import.py test_production_runtime_modularization.py test_module_architecture.py test_router_migration_adapters.py test_architecture_compatibility.py test_route_audit.py test_route_ownership.py test_runtime_switch.py test_taskosphere_tasks_runtime.py test_taskosphere_tasks_route_contract.py test_final_architecture_contract.py test_tenant_reconciliation.py test_collection_ownership.pyn_hardening.py test_finix_integrity_hardening.py test_phase2_runtime_import.py test_production_runtime_modularization.py test_module_architecture.py
