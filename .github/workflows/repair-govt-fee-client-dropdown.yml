name: Repair Govt Fee Client Dropdown

on:
  push:
    branches:
      - feature/master-console

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/master-console
          fetch-depth: 0

      - name: Patch client loader
        run: |
          if git log -1 --pretty=%B | grep -q '\[botfix-govt-fee-client-dropdown\]'; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/pages/CompliancePage.jsx')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"    if \(!adhocClients\.length\) \{.*?^  \}, \[pageView, refreshKey, user\?\.id\]\);", re.M | re.S)
          replacement = '''    // Refresh the client master whenever the Govt Fee dialog opens. Normalize
    // the supported API response envelopes so the selector always receives rows.
    if (showAdhocDialog || !adhocClients.length) {
      (async () => {
        const PAGE_SIZE = 500;
        let page = 1;
        let all = [];
        const extractClientRows = payload => {
          if (Array.isArray(payload)) return payload;
          const candidates = [
            payload?.clients,
            payload?.items,
            payload?.results,
            payload?.data,
            payload?.data?.clients,
            payload?.data?.items,
            payload?.data?.results,
          ];
          return candidates.find(Array.isArray) || [];
        };

        try {
          while (page <= 50) {
            const r = await api.get('/clients', { params: { page, page_size: PAGE_SIZE } });
            const batch = extractClientRows(r.data);
            all = all.concat(batch);
            if (batch.length < PAGE_SIZE) break;
            page += 1;
          }

          const normalized = all
            .map(c => ({
              id: c?.id || c?._id || c?.client_id,
              name: c?.company_name || c?.name || c?.client_name || '',
            }))
            .filter(c => c.id && c.name);

          setAdhocClients(normalized);
        } catch (err) {
          console.error('Failed to load clients for Govt Fee dialog:', err?.response?.status, err?.response?.data);
          toast.error('Could not load client list — please refresh and try again');
          setAdhocClients([]);
        }
      })();
    }
  }, [pageView, refreshKey, user?.id, showAdhocDialog]);'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one Govt Fee client-loader block, found {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          rm -f .github/workflows/repair-govt-fee-client-dropdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/CompliancePage.jsx .github/workflows/repair-govt-fee-client-dropdown.yml
          git diff --cached --check
          git commit -m "fix: load clients in govt fee dropdown [botfix-govt-fee-client-dropdown]"
          git push origin HEAD:feature/master-console
