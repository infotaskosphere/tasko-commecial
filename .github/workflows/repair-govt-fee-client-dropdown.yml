name: Repair Govt Fee Client And Amount Flow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/master-console

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: "!contains(github.event.pull_request.head.ref, 'botfix-govt-fee-client-dropdown')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch Government Fee client and amount flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Fix the Government Fee client selector.
          path = Path('frontend/src/pages/CompliancePage.jsx')
          source = path.read_text(encoding='utf-8')
          start_marker = "    if (!adhocClients.length) {"
          end_marker = "  }, [pageView, refreshKey, user?.id]);"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate the existing Govt Fee client-loader block')
          end += len(end_marker)

          replacement = '''    // Govt Fee client selector uses the authoritative client master.
    // Refresh whenever the dialog opens and normalize supported API envelopes.
    if (showAdhocDialog || !adhocClients.length) {
      (async () => {
        const PAGE_SIZE = 500;
        let page = 1;
        const all = [];

        const extractClientRows = payload => {
          if (Array.isArray(payload)) return payload;
          const candidates = [
            payload?.clients,
            payload?.items,
            payload?.results,
            payload?.data,
            payload?.data?.clients,
            payload?.data?.items,
            payload?.data?.results,
          ];
          return candidates.find(Array.isArray) || [];
        };

        try {
          while (page <= 50) {
            const response = await api.get('/clients', {
              params: { page, page_size: PAGE_SIZE },
            });
            const batch = extractClientRows(response?.data);
            all.push(...batch);
            if (batch.length < PAGE_SIZE) break;
            page += 1;
          }

          const seen = new Set();
          const normalized = all
            .map(client => ({
              id: client?.id ?? client?._id ?? client?.client_id,
              name: String(
                client?.company_name ??
                client?.name ??
                client?.client_name ??
                client?.display_name ??
                ''
              ).trim(),
            }))
            .filter(client => client.id && client.name)
            .filter(client => {
              const key = String(client.id);
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

          setAdhocClients(normalized);
        } catch (err) {
          console.error(
            'Failed to load clients for Govt Fee dialog:',
            err?.response?.status,
            err?.response?.data || err
          );
          setAdhocClients([]);
          toast.error('Could not load client list — please refresh and try again');
        }
      })();
    }
  }, [pageView, refreshKey, user?.id, showAdhocDialog]);'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          # 2) Fix the Government Fee amount contract at the backend boundary.
          backend = Path('backend/compliance.py')
          source = backend.read_text(encoding='utf-8')
          old = '''        items.append({
            "assignment_id":    a["id"],
            "compliance_id":    m["id"],
            "name":             m.get("name"),
            "category":         m.get("category"),
            "frequency":        m.get("frequency"),
            "fy_year":          m.get("fy_year"),
            "period_label":     m.get("period_label"),
            "due_date":         m.get("due_date"),
            "status":           a.get("status"),
            "govt_fees_amount": a.get("govt_fees_amount", 0) or 0,
            "govt_fees_notes":  a.get("govt_fees_notes", "") or "",
            "govt_fees_srn":    a.get("govt_fees_srn", "") or "",
'''
          new = '''        # Normalize the fee amount at the API boundary. New records use
          # govt_fees_amount; legacy records may contain amount/govt_fee_amount.
          raw_fee_amount = (
              a.get("govt_fees_amount")
              if a.get("govt_fees_amount") is not None
              else a.get("govt_fee_amount")
          )
          if raw_fee_amount is None:
              raw_fee_amount = a.get("amount", 0)
          try:
              fee_amount = float(raw_fee_amount or 0)
          except (TypeError, ValueError):
              fee_amount = 0.0

          items.append({
              "assignment_id":    a["id"],
              "compliance_id":    m["id"],
              "name":             m.get("name"),
              "category":         m.get("category"),
              "frequency":        m.get("frequency"),
              "fy_year":          m.get("fy_year"),
              "period_label":     m.get("period_label"),
              "due_date":         m.get("due_date"),
              "status":           a.get("status"),
              "amount":           fee_amount,
              "govt_fees_amount": fee_amount,
              "govt_fees_notes":  a.get("govt_fees_notes", "") or "",
              "govt_fees_srn":    a.get("govt_fees_srn", "") or "",
'''
          if old not in source:
              raise SystemExit('Could not locate compliance Govt Fee response block')
          backend.write_text(source.replace(old, new, 1), encoding='utf-8')

          # 3) Make the invoice-side amount parser resilient to legacy/API values.
          inv = Path('frontend/src/pages/Invoicing.jsx')
          source = inv.read_text(encoding='utf-8')
          old_start = "  const loadGovernmentFees = useCallback(async () => {\n"
          old_end = "  }, [form.client_id, form.invoice_date]);\n\n  useEffect(() => {\n    if (activeTab === 'govt_fees'"
          start = source.find(old_start)
          end = source.find(old_end, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate loadGovernmentFees block')

          new_block = r'''  const loadGovernmentFees = useCallback(async () => {
            if (!form.client_id) {
              setGovtFees([]);
              setGovtFeeSelection(new Set());
              return;
            }

            setGovtFeeLoading(true);
            try {
              const [complianceRes, standaloneRes] = await Promise.all([
                api.get(`/compliance/by-client/${form.client_id}`, { params: { govt_fees: true } }),
                api.get('/compliance/standalone-govt-fees', { params: { client_id: form.client_id } }),
              ]);

              const cycle = String(form.invoice_date || format(new Date(), 'yyyy-MM-dd')).slice(0, 7);
              const money = value => {
                if (value === null || value === undefined || value === '') return 0;
                const cleaned = String(value).replace(/[₹,\s]/g, '');
                const parsed = Number(cleaned);
                return Number.isFinite(parsed) ? parsed : 0;
              };
              const notBilled = item => {
                if (item.govt_fee_invoice_id || item.invoice_id || item.invoice_no) return false;
                if (item.bill_in_next_cycle) {
                  const deferred = String(item.govt_fee_deferred_at || '').slice(0, 7);
                  if (deferred && cycle <= deferred) return false;
                }
                return true;
              };

              const complianceRows = Array.isArray(complianceRes.data?.items)
                ? complianceRes.data.items
                : [];
              const standaloneRows = Array.isArray(standaloneRes.data?.items)
                ? standaloneRes.data.items
                : [];

              const complianceFees = complianceRows
                .filter(notBilled)
                .map(item => {
                  const amount = money(
                    item.amount ??
                    item.govt_fees_amount ??
                    item.govt_fee_amount ??
                    item.fee_amount
                  );
                  return {
                    marker: `compliance_govt_fee:${item.assignment_id}`,
                    source: 'compliance',
                    title: item.name || 'Government Fee',
                    category: item.category || 'OTHER',
                    amount,
                    srn: item.govt_fees_srn || item.srn || '',
                    payment_date: item.payment_date || item.govt_fee_billed_at || item.updated_at || '',
                    notes: item.govt_fees_notes || item.notes || '',
                  };
                })
                .filter(item => item.amount > 0);

              const standaloneFees = standaloneRows
                .filter(item => notBilled(item) && (!item.status || item.status === 'paid'))
                .map(item => ({
                  marker: `standalone_govt_fee:${item.id}`,
                  source: 'standalone',
                  title: item.title || 'Government Fee',
                  category: item.category || 'OTHER',
                  amount: money(item.amount),
                  srn: item.srn || '',
                  payment_date: item.payment_date || item.updated_at || '',
                  notes: item.notes || '',
                }))
                .filter(item => item.amount > 0);

              const fees = [...complianceFees, ...standaloneFees];
              setGovtFees(fees);
              setGovtFeeSelection(new Set());
            } catch (err) {
              console.warn('Could not load Government Fees:', err?.response?.data || err);
              setGovtFees([]);
              setGovtFeeSelection(new Set());
              toast.error('Could not load Government Fees for this client');
            } finally {
              setGovtFeeLoading(false);
            }
          }, [form.client_id, form.invoice_date]);

'''
          inv.write_text(source[:start] + new_block + source[end:], encoding='utf-8')
          print('Government Fee client and amount patches applied')
          PY

      - name: Validate source
        run: |
          python3 -m py_compile backend/compliance.py
          grep -q "showAdhocDialog || !adhocClients.length" frontend/src/pages/CompliancePage.jsx
          grep -q "const money = value =>" frontend/src/pages/Invoicing.jsx
          grep -q '"amount":           fee_amount' backend/compliance.py
          git diff --check

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/CompliancePage.jsx frontend/src/pages/Invoicing.jsx backend/compliance.py
          git diff --cached --check
          git commit -m "fix: repair govt fee client and amount flow [botfix-govt-fee-client-dropdown]"
          git rm .github/workflows/repair-govt-fee-client-dropdown.yml
          git commit -m "chore: remove one-time govt fee repair workflow [botfix-govt-fee-client-dropdown]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
