name: Repair Govt Fee Client Dropdown

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/master-console

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: "!contains(github.event.pull_request.head.ref, 'botfix-govt-fee-client-dropdown')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch client loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/CompliancePage.jsx')
          source = path.read_text(encoding='utf-8')

          start_marker = "    if (!adhocClients.length) {"
          end_marker = "  }, [pageView, refreshKey, user?.id]);"

          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate the existing Govt Fee client-loader block')
          end += len(end_marker)

          replacement = '''    // Govt Fee client selector uses the authoritative client master.
    // Refresh whenever the dialog opens and normalize every supported API envelope.
    if (showAdhocDialog || !adhocClients.length) {
      (async () => {
        const PAGE_SIZE = 500;
        let page = 1;
        const all = [];

        const extractClientRows = payload => {
          if (Array.isArray(payload)) return payload;
          const candidates = [
            payload?.clients,
            payload?.items,
            payload?.results,
            payload?.data,
            payload?.data?.clients,
            payload?.data?.items,
            payload?.data?.results,
          ];
          return candidates.find(Array.isArray) || [];
        };

        try {
          while (page <= 50) {
            const response = await api.get('/clients', {
              params: { page, page_size: PAGE_SIZE },
            });
            const batch = extractClientRows(response?.data);
            all.push(...batch);
            if (batch.length < PAGE_SIZE) break;
            page += 1;
          }

          const seen = new Set();
          const normalized = all
            .map(client => ({
              id: client?.id ?? client?._id ?? client?.client_id,
              name: String(
                client?.company_name ??
                client?.name ??
                client?.client_name ??
                client?.display_name ??
                ''
              ).trim(),
            }))
            .filter(client => client.id && client.name)
            .filter(client => {
              const key = String(client.id);
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

          setAdhocClients(normalized);
        } catch (err) {
          console.error(
            'Failed to load clients for Govt Fee dialog:',
            err?.response?.status,
            err?.response?.data || err
          );
          setAdhocClients([]);
          toast.error('Could not load client list — please refresh and try again');
        }
      })();
    }
  }, [pageView, refreshKey, user?.id, showAdhocDialog]);'''

          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          print('Govt Fee client loader patched successfully')
          PY

      - name: Validate source
        run: |
          test -s frontend/src/pages/CompliancePage.jsx
          grep -q "showAdhocDialog || !adhocClients.length" frontend/src/pages/CompliancePage.jsx
          grep -q "payload?.items" frontend/src/pages/CompliancePage.jsx
          grep -q "client?.client_id" frontend/src/pages/CompliancePage.jsx
          git diff --check

      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/CompliancePage.jsx .github/workflows/repair-govt-fee-client-dropdown.yml
          git diff --cached --check
          git commit -m "fix: load company clients in govt fee dropdown [botfix-govt-fee-client-dropdown]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
