name: Repair Govt Fee Client Dropdown

on:
  push:
    branches:
      - feature/master-console

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/master-console
          fetch-depth: 0

      - name: Patch client loader
        run: |
          if git log -1 --pretty=%B | grep -q '\[botfix-govt-fee-client-dropdown\]'; then
            echo "Repair already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('frontend/src/pages/CompliancePage.jsx')
          text = path.read_text(encoding='utf-8')

          old = base64.b64decode(''.encode())
          new = base64.b64decode(''.encode())

          if old not in text:
              raise SystemExit('Expected client-loader block not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          rm -f .github/workflows/repair-govt-fee-client-dropdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/CompliancePage.jsx .github/workflows/repair-govt-fee-client-dropdown.yml
          git diff --cached --check
          git commit -m "fix: load clients in govt fee dropdown [botfix-govt-fee-client-dropdown]"
          git push origin HEAD:feature/master-console
