name: repair-website-builder
on:
  push:
    branches:
      - feature/master-console
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'repair: fix WebsiteBuilder JSX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JSX closing tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/WebsiteBuilder.jsx')
          s = p.read_text()
          old = '</div></div></div></div></div></main>'
          new = '</div></div></div></div></div></div></div></main>'
          if old not in s:
              raise SystemExit('Expected JSX tail was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-website-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/WebsiteBuilder.jsx .github/workflows/repair-website-builder.yml
          git commit -m 'repair: fix WebsiteBuilder JSX'
          git push
