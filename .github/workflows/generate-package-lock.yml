name: Generate package-lock.json (one-off)

# Run manually once. GitHub's runners can download the SheetJS tarball from
# cdn.sheetjs.com, which the development sandbox cannot. Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lock file (no install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify a clean install and build from the lock
        run: |
          npm ci --no-audit --no-fund
          VITE_API_URL=https://tasko-commercial-backend.onrender.com npm run build
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Add frontend package-lock.json (generated by GitHub Actions)"
          git push
