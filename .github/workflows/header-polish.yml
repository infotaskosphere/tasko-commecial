name: Header Polish
on:
  push:
    branches: [feature/master-console]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-console
          fetch-depth: 0
      - name: Apply consistent reminder button sizing
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/Reminders.jsx')
          s = p.read_text()
          s = s.replace('className="w-full min-w-0 h-9 text-sm whitespace-nowrap rounded-none bg-white/15', 'className="w-full min-w-0 h-9 text-xs font-semibold whitespace-nowrap rounded-none bg-white/15', 1)
          s = s.replace('className="w-full min-w-0 h-9 whitespace-nowrap rounded-none text-sm font-semibold', 'className="w-full min-w-0 h-9 whitespace-nowrap rounded-none text-xs font-semibold', 1)
          s = s.replace('text-[11px] font-semibold whitespace-nowrap overflow-hidden', 'text-xs font-semibold whitespace-nowrap overflow-hidden')
          p.write_text(s)
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Reminders.jsx
          git commit -m "fix: normalize reminders header button size [skip ci]"
          git rm .github/workflows/header-polish.yml
          git commit -m "chore: remove header polish workflow [skip ci]"
          git push origin feature/master-console
