<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <meta property="og:title" content="Taskosphere" />
    <meta property="og:description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <link rel="stylesheet" href="/src/commercial-card-shape-fixes.css" />
    <link rel="stylesheet" href="/src/commercial-console-sidebar.css" />
    <link rel="stylesheet" href="/src/commercial-console-native-tab.css" />
    <title>Taskosphere</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
>

    <script>
      (() => {
        /* People Matrix greeting follows the user's current local time and
           refreshes automatically without changing the rest of the card. */
        let scheduled = false;
        const greeting = () => {
          const hour = new Date().getHours();
          if (hour < 12) return 'Good Morning';
          if (hour < 17) return 'Good Afternoon';
          if (hour < 21) return 'Good Evening';
          return 'Working Late';
        };
        const syncGreeting = () => {
          scheduled = false;
          if (location.pathname !== '/people-matrix') return;
          const title = Array.from(document.querySelectorAll('main h1')).find((el) => /^(Good Morning|Good Afternoon|Good Evening|Working Late),/.test(el.textContent.trim()));
          if (!title) return;
          const current = title.textContent.trim();
          const match = current.match(/^(Good Morning|Good Afternoon|Good Evening|Working Late),(.*)$/);
          if (!match) return;
          title.textContent = `${greeting()},${match[2]}`;
        };
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(syncGreeting, 0);
        };
        const observer = new MutationObserver(schedule);
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true, characterData: true });
        window.addEventListener('popstate', schedule);
        document.addEventListener('click', schedule, true);
        window.setInterval(schedule, 60000);
        schedule();
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
