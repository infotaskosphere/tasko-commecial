<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <meta property="og:title" content="Taskosphere" />
    <meta property="og:description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <link rel="stylesheet" href="/src/commercial-card-shape-fixes.css" />
    <link rel="stylesheet" href="/src/commercial-console-sidebar.css" />
    <link rel="stylesheet" href="/src/commercial-console-native-tab.css" />
    <title>Taskosphere</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        const id = 'taskosphere-backup-sidebar-link';
        let scheduled = false;
        const sync = () => {
          scheduled = false;
          let user = null;
          try {
            const raw = localStorage.getItem('user') || sessionStorage.getItem('user');
            user = raw ? JSON.parse(raw) : null;
          } catch (_) {}
          const existing = document.getElementById(id);
          const isAdmin = String(user?.role || '').toLowerCase() === 'admin';
          const isApproved = user?.permissions?.can_view_backup_restore === true;
          if (!user || (!isAdmin && !isApproved) || location.pathname === '/login') {
            if (existing) existing.remove();
            return;
          }
          const settingsItem = document.querySelector('a[href="/settings/whatsapp"]');
          if (!settingsItem) {
            if (existing) existing.remove();
            return;
          }
          const link = existing || document.createElement('a');
          link.id = id;
          link.href = '/settings/backup';
          link.setAttribute('aria-label', 'Backup & Restore');
          link.title = 'Backup & Restore';
          link.className = settingsItem.className;
          if (!existing) {
            link.innerHTML = '<span aria-hidden="true" class="flex-shrink-0 transition-colors h-4 w-4 text-slate-400">▣</span><span class="font-medium text-sm whitespace-nowrap tracking-tight truncate">Backup &amp; Restore</span>';
          }
          const isActive = location.pathname === '/settings/backup' || location.pathname.startsWith('/settings/backup/');
          const nextClass = settingsItem.className + (isActive ? ' bg-white/[0.09] text-white' : '');
          if (link.className !== nextClass) link.className = nextClass;
          if (!existing || link.previousElementSibling !== settingsItem) settingsItem.parentNode.insertBefore(link, settingsItem.nextSibling);
        };
        const scheduleSync = (delay = 0) => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(sync, delay);
        };
        scheduleSync(100);
        window.addEventListener('load', () => scheduleSync(100));
        document.addEventListener('click', (event) => {
          if (event.target?.closest?.('a[href^="/settings"], button[id^="nav-tab-settings"]')) scheduleSync(100);
        }, true);
        window.addEventListener('storage', () => scheduleSync(100));
        window.addEventListener('popstate', () => scheduleSync(100));
      })();
    </script>

    <script>
      (() => {
        /* People Matrix greeting follows the user's current local time and
           refreshes automatically without changing the rest of the card. */
        let scheduled = false;
        const greeting = () => {
          const hour = new Date().getHours();
          if (hour < 12) return 'Good Morning';
          if (hour < 17) return 'Good Afternoon';
          if (hour < 21) return 'Good Evening';
          return 'Working Late';
        };
        const syncGreeting = () => {
          scheduled = false;
          if (location.pathname !== '/people-matrix') return;
          const title = Array.from(document.querySelectorAll('main h1')).find((el) => /^(Good Morning|Good Afternoon|Good Evening|Working Late),/.test(el.textContent.trim()));
          if (!title) return;
          const current = title.textContent.trim();
          const match = current.match(/^(Good Morning|Good Afternoon|Good Evening|Working Late),(.*)$/);
          if (!match) return;
          title.textContent = `${greeting()},${match[2]}`;
        };
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(syncGreeting, 0);
        };
        const observer = new MutationObserver(schedule);
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true, characterData: true });
        window.addEventListener('popstate', schedule);
        document.addEventListener('click', schedule, true);
        window.setInterval(schedule, 60000);
        schedule();
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
